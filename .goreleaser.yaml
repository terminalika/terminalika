version: 2

project_name: terminalika

builds:
  - id: terminalika
    main: .
    binary: terminalika
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: default
    # No version in the name: docs link straight at
    # releases/latest/download/<name> and never go stale.
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^chore:'
      - '^test:'

# Homebrew cask pushed to github.com/terminalika/homebrew-tap
# (`brew install --cask terminalika`).
homebrew_casks:
  - name: terminalika
    repository:
      owner: terminalika
      name: homebrew-tap
    homepage: https://github.com/terminalika/terminalika
    description: Tiny terminal game launcher for AI-agent waiting time
    license: MIT

# Scoop manifest pushed to github.com/terminalika/scoop-bucket
# (`scoop bucket add terminalika https://github.com/terminalika/scoop-bucket`).
scoops:
  - name: terminalika
    repository:
      owner: terminalika
      name: scoop-bucket
    homepage: https://github.com/terminalika/terminalika
    description: Tiny terminal game launcher for AI-agent waiting time
    license: MIT

# deb/rpm/apk packages attached to the GitHub release.
nfpms:
  - id: default
    package_name: terminalika
    # No version in the name (same reasoning as archives above): keeps
    # releases/latest/download/<name> links working across every release.
    # .ConventionalExtension already carries its own leading dot (".deb",
    # ".pkg.tar.zst", ...) and .Arch is the plain "amd64"/"arm64" pair for
    # every format here, not each distro's native arch spelling.
    file_name_template: "{{ .PackageName }}_{{ .Arch }}{{ .ConventionalExtension }}"
    homepage: https://github.com/terminalika/terminalika
    description: Tiny terminal game launcher for AI-agent waiting time
    maintainer: Terminalika
    license: MIT
    formats:
      - deb
      - rpm
      - apk
      - archlinux
